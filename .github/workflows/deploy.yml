name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write lets the build commit auto-generated meta.json back to the repo.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://bambucd.xyz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `prebuild` regenerates meta.json (for photo-only comics), thumbnails,
      # src/data/comics.json + public/comics from content/comics, then
      # `next build` exports static HTML to ./out
      - name: Build static site
        run: npm run build

      # Persist any meta.json that was just auto-generated, so comic numbers and
      # dates stay stable on future builds. ([skip ci] avoids a redeploy loop.)
      - name: Persist auto-generated comic metadata
        run: |
          if [ -n "$(git status --porcelain content/comics)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/comics
            git commit -m "chore: auto-generate comic metadata [skip ci]"
            git push
          else
            echo "No new metadata to persist."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
